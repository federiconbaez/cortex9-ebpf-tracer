[package]
name = "cortex9-tracer"
description = "Syscall tracer built on eBPF (aya): raw_syscalls tracepoints, ring buffer, CLI filters."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["ebpf", "aya", "tracing", "syscalls", "linux"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "cortex9_tracer"
path = "src/lib.rs"

[[bin]]
name = "cortex9-tracer"
path = "src/main.rs"

[dependencies]
cortex9-tracer-common = { path = "../cortex9-tracer-common" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "time"] }
